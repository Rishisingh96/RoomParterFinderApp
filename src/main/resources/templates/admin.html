<!DOCTYPE html>
<html
  lang="en"
  th:replace="~{main :: parent(~{::#content},~{::title},~{::script})}"
  xmlns:th="http://www.w3.org/1999/xhtml"
>
  <head>
    <meta charset="UTF-8" />
    <title>Admin Dashboard</title>
    <script defer data-th-src="@{'/js/admin.js'}"></script>
    <style>
      /* Circular Progress for Total Users */
      .circular-progress {
        position: relative;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: conic-gradient(
          #3b82f6 0deg,
          #3b82f6 calc(var(--progress) * 3.6deg),
          #e5e7eb calc(var(--progress) * 3.6deg),
          #e5e7eb 360deg
        );
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        transition: all 0.3s ease;
      }
      
      .dark .circular-progress {
        background: conic-gradient(
          #60a5fa 0deg,
          #60a5fa calc(var(--progress) * 3.6deg),
          #374151 calc(var(--progress) * 3.6deg),
          #374151 360deg
        );
        box-shadow: 0 10px 30px rgba(96, 165, 250, 0.3);
      }
      
      .circular-progress:hover {
        transform: scale(1.05);
        box-shadow: 0 15px 40px rgba(59, 130, 246, 0.4);
      }
      
      .circular-progress::before {
        content: '';
        position: absolute;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background-color: white;
      }
      
      .dark .circular-progress::before {
        background-color: #1f2937;
      }
      
      .circular-progress .progress-value {
        position: relative;
        font-size: 1.8rem;
        font-weight: bold;
        color: #1f2937;
      }
      
      .dark .circular-progress .progress-value {
        color: #f3f4f6;
      }
      
      /* Animations */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes slideIn {
        from { opacity: 0; transform: translateX(-20px); }
        to { opacity: 1; transform: translateX(0); }
      }
      
      .animate-fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }
      
      .animate-slide-in {
        animation: slideIn 0.3s ease-out forwards;
      }
      
      /* Button Styles */
      .btn-action {
        transition: all 0.2s ease;
        position: relative;
        overflow: hidden;
      }
      
      .btn-action:hover {
        transform: scale(1.05);
      }
      
      .btn-action:active {
        transform: scale(0.95);
      }
      
      /* Table Row Hover */
      .user-row {
        transition: all 0.2s ease;
      }
      
      .user-row:hover {
        background-color: rgba(59, 130, 246, 0.05);
      }
      
      .dark .user-row:hover {
        background-color: rgba(96, 165, 250, 0.1);
      }
      
      /* Status Badge */
      .status-badge {
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      
      .status-enabled {
        background-color: #10b981;
        color: white;
        box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
      }
      
      .status-disabled {
        background-color: #ef4444;
        color: white;
        box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);
      }
      
      /* Role Badge */
      .role-badge {
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        margin-right: 4px;
        margin-bottom: 4px;
        display: inline-block;
      }
      
      .role-admin {
        background-color: #8b5cf6;
        color: white;
      }
      
      .role-user {
        background-color: #3b82f6;
        color: white;
      }
      
      /* Search Input */
      .search-input {
        transition: all 0.3s ease;
        border: 2px solid #d1d5db;
      }
      
      .dark .search-input {
        border-color: #4b5563;
        background-color: #1f2937;
      }
      
      .search-input:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
      }
      
      /* Table Card */
      .table-card {
        background-color: white;
        border: 1px solid #e5e7eb;
        border-radius: 1rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }
      
      .dark .table-card {
        background-color: #1f2937;
        border-color: #374151;
      }
      
      /* Table Header */
      .table-header {
        background-color: #f9fafb;
        border-bottom: 1px solid #e5e7eb;
      }
      
      .dark .table-header {
        background-color: #111827;
        border-bottom-color: #374151;
      }
      
      /* Table Head */
      .table-head {
        background-color: #f3f4f6;
        color: #374151;
      }
      
      .dark .table-head {
        background-color: #1f2937;
        color: #e5e7eb;
      }
      
      /* Table Row Divider */
      .table-row-divider {
        border-color: #f3f4f6;
      }
      
      .dark .table-row-divider {
        border-color: #374151;
      }
      
      /* Footer */
      .table-footer {
        background-color: #f9fafb;
        border-top: 1px solid #e5e7eb;
      }
      
      .dark .table-footer {
        background-color: #111827;
        border-top-color: #374151;
      }
    </style>
  </head>
  <body>
    <section id="content" class="text-gray-900 dark:text-white">
      <!-- Page Header -->
      <div class="relative mb-8 animate-fade-in">
        <div class="flex items-center justify-between p-6">
          <div>
            <h1 class="text-4xl font-extrabold tracking-tight text-gray-900 dark:text-white">
              Admin Dashboard
            </h1>
            <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
              Manage all users, roles, and account status from one place.
            </p>
          </div>
          <button
            id="refreshBtn"
            class="inline-flex items-center px-6 py-3 rounded-xl text-sm font-bold bg-blue-600 text-white hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-500/30 transition-all duration-300 shadow-lg hover:shadow-xl"
          >
            <i class="fa-solid fa-rotate-right mr-2"></i>
            Refresh
          </button>
        </div>
      </div>

      <!-- Total Users Circular Progress -->
      <div class="flex items-center justify-center mb-8 animate-fade-in" style="animation-delay: 0.1s">
        <div class="text-center">
          <div class="circular-progress mx-auto mb-4" style="--progress: 100">
            <span class="progress-value" data-th-text="${totalUsers}">0</span>
          </div>
          <p class="text-lg font-semibold text-gray-900 dark:text-white">Total Users</p>
        </div>
      </div>

      <!-- Users Table Card -->
      <div class="table-card overflow-hidden animate-fade-in" style="animation-delay: 0.2s">
        <div class="table-header px-6 py-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
          <div>
            <h2 class="text-xl font-bold text-gray-900 dark:text-white flex items-center gap-2">
              <i class="fa-solid fa-users-gear text-blue-600"></i>
              All Users
            </h2>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">
              Search, filter and manage user accounts.
            </p>
          </div>
          <div class="flex items-center gap-3 w-full sm:w-auto">
            <div class="relative w-full sm:w-72">
              <input
                id="adminSearch"
                type="text"
                placeholder="🔍 Search by name or email..."
                class="search-input w-full px-4 py-2.5 text-sm rounded-xl bg-white dark:bg-gray-800 text-gray-900 dark:text-white"
              />
            </div>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="min-w-full text-sm">
            <thead class="table-head">
              <tr>
                <th class="px-6 py-4 text-left font-bold uppercase tracking-wider text-xs">Name</th>
                <th class="px-6 py-4 text-left font-bold uppercase tracking-wider text-xs">Email</th>
                <th class="px-6 py-4 text-left font-bold uppercase tracking-wider text-xs">Status</th>
                <th class="px-6 py-4 text-left font-bold uppercase tracking-wider text-xs">Roles</th>
                <th class="px-6 py-4 text-left font-bold uppercase tracking-wider text-xs">Actions</th>
              </tr>
            </thead>
            <tbody id="adminUsersBody" class="divide-y table-row-divider">
              <tr>
                <td colspan="5" class="px-6 py-8 text-center text-gray-500 dark:text-gray-400">
                  <div class="flex flex-col items-center gap-2">
                    <i class="fa-solid fa-spinner fa-spin text-2xl text-blue-500"></i>
                    <span>Loading users...</span>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="table-footer px-6 py-4 text-xs text-gray-500 dark:text-gray-400 flex justify-between items-center">
          <span class="flex items-center gap-2">
            <i class="fa-solid fa-lightbulb text-yellow-500"></i>
            Tip: Use desktop for best admin experience.
          </span>
          <span class="font-semibold text-blue-600 dark:text-blue-400">Admin Panel · RoomPartnerFinder</span>
        </div>
      </div>
    </section>
  </body>
</html>
